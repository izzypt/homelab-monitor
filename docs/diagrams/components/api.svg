<svg xmlns="http://www.w3.org/2000/svg" width="520" height="390" viewBox="0 0 520 390" role="img" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>api component</title><desc>api: Stateless REST API under /api/v1 (OpenAPI, RFC 9457 errors).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#59636e"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.8" flood-color="#0f172a" flood-opacity="0.12"/></filter><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="520" height="390" rx="16" fill="#ffffff"/><rect x="1" y="1" width="518" height="388" rx="16" fill="#ffffff" stroke="#d0d7de"/><path d="M1 17a16 16 0 0 1 16-16h486a16 16 0 0 1 16 16v59H1z" fill="#dbeafe"/><circle cx="46" cy="39" r="23" fill="#2563eb"/><g transform="translate(23.0 16.0) scale(1.9166666666666667)" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M13 4 7 13h4.5L11 20l6-9h-4.5z"/></g><text x="82" y="35" font-size="21" font-weight="700" fill="#1f2328">api</text><text x="82" y="56" font-size="12.5" fill="#59636e">compose · FastAPI on :8000</text><rect x="405.4" y="16" width="94.6" height="22" rx="11" fill="#2563eb"/><text x="452.7" y="31" font-size="11.5" font-weight="600" fill="#fff" text-anchor="middle">Application</text><text x="24" y="102" font-size="14" font-style="italic" fill="#1f2328">Stateless REST API under /api/v1 (OpenAPI, RFC 9457 errors).</text><text x="24" y="128" font-size="11" font-weight="700" fill="#2563eb" letter-spacing="0.6">RESPONSIBILITIES</text><circle cx="30" cy="145.5" r="3" fill="#2563eb"/><text x="42" y="150" font-size="13.5" fill="#1f2328">Login, logout and sessions (argon2id, session in Redis, CSRF</text><text x="42" y="169" font-size="13.5" fill="#1f2328">header)</text><circle cx="30" cy="187.5" r="3" fill="#2563eb"/><text x="42" y="192" font-size="13.5" fill="#1f2328">Dashboard, hosts, monitors, incidents and containers endpoints</text><circle cx="30" cy="210.5" r="3" fill="#2563eb"/><text x="42" y="215" font-size="13.5" fill="#1f2328">Agent ingest: stores heartbeats, detects reboots, opens and</text><text x="42" y="234" font-size="13.5" fill="#1f2328">closes host incidents</text><circle cx="30" cy="252.5" r="3" fill="#2563eb"/><text x="42" y="257" font-size="13.5" fill="#1f2328">Enqueues send_alert and check-now tasks; /healthz and /readyz</text><text x="24" y="294" font-size="11" font-weight="700" fill="#2563eb" letter-spacing="0.6">TALKS TO</text><rect x="24.0" y="306" width="126.7" height="26" rx="13" fill="#dbeafe" stroke="#2563eb" stroke-opacity="0.5"/><text x="36.0" y="323.5" font-size="12.5" fill="#1f2328"><tspan font-weight="700">→ postgres</tspan><tspan fill="#59636e" dx="6">SQL</tspan></text><rect x="158.7" y="306" width="207.4" height="26" rx="13" fill="#dbeafe" stroke="#2563eb" stroke-opacity="0.5"/><text x="170.7" y="323.5" font-size="12.5" fill="#1f2328"><tspan font-weight="700">→ redis</tspan><tspan fill="#59636e" dx="6">sessions · enqueue</tspan></text><line x1="24" x2="496" y1="340" y2="340" stroke="#d0d7de"/><text x="24" y="358" font-size="11.5" fill="#59636e" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace">networks data + egress · mem 192 MB · read-only rootfs, cap_drop ALL</text></svg>
