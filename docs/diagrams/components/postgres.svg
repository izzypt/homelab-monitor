<svg xmlns="http://www.w3.org/2000/svg" width="520" height="371" viewBox="0 0 520 371" role="img" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>postgres component</title><desc>postgres: System of record. Everything except sessions lives here.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#59636e"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.8" flood-color="#0f172a" flood-opacity="0.12"/></filter><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="520" height="371" rx="16" fill="#ffffff"/><rect x="1" y="1" width="518" height="369" rx="16" fill="#ffffff" stroke="#d0d7de"/><path d="M1 17a16 16 0 0 1 16-16h486a16 16 0 0 1 16 16v59H1z" fill="#d1fae5"/><circle cx="46" cy="39" r="23" fill="#059669"/><g transform="translate(23.0 16.0) scale(1.9166666666666667)" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="7.5" rx="6" ry="2.5"/><path d="M6 7.5v9c0 1.4 2.7 2.5 6 2.5s6-1.1 6-2.5v-9"/><path d="M6 12c0 1.4 2.7 2.5 6 2.5s6-1.1 6-2.5"/></g><text x="82" y="35" font-size="21" font-weight="700" fill="#1f2328">postgres</text><text x="82" y="56" font-size="12.5" fill="#59636e">compose · PostgreSQL 16 (alpine)</text><rect x="405.4" y="16" width="94.6" height="22" rx="11" fill="#059669"/><text x="452.7" y="31" font-size="11.5" font-weight="600" fill="#fff" text-anchor="middle">Data stores</text><text x="24" y="102" font-size="14" font-style="italic" fill="#1f2328">System of record. Everything except sessions lives here.</text><text x="24" y="128" font-size="11" font-weight="700" fill="#059669" letter-spacing="0.6">RESPONSIBILITIES</text><circle cx="30" cy="145.5" r="3" fill="#059669"/><text x="42" y="150" font-size="13.5" fill="#1f2328">hosts, heartbeats, boot_events, monitors, check_results,</text><text x="42" y="169" font-size="13.5" fill="#1f2328">incidents, alerts</text><circle cx="30" cy="187.5" r="3" fill="#059669"/><text x="42" y="192" font-size="13.5" fill="#1f2328">containers, container_events and daily_uptime</text><circle cx="30" cy="210.5" r="3" fill="#059669"/><text x="42" y="215" font-size="13.5" fill="#1f2328">Raw data kept 30 days, daily summaries ~6 months, then pruned</text><circle cx="30" cy="233.5" r="3" fill="#059669"/><text x="42" y="238" font-size="13.5" fill="#1f2328">Named volume pgdata survives restarts, redeploys and reboots</text><text x="24" y="275" font-size="11" font-weight="700" fill="#059669" letter-spacing="0.6">TALKS TO</text><rect x="24.0" y="287" width="295.9" height="26" rx="13" fill="#d1fae5" stroke="#059669" stroke-opacity="0.5"/><text x="36.0" y="304.5" font-size="12.5" fill="#1f2328"><tspan font-weight="700">← api / workers / migrate</tspan><tspan fill="#59636e" dx="6">inbound SQL</tspan></text><line x1="24" x2="496" y1="321" y2="321" stroke="#d0d7de"/><text x="24" y="339" font-size="11.5" fill="#59636e" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace">Internal network only · no backups by choice · mem 256 MB</text></svg>
