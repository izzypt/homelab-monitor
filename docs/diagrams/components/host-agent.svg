<svg xmlns="http://www.w3.org/2000/svg" width="520" height="432" viewBox="0 0 520 432" role="img" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>host-agent component</title><desc>host-agent: Native Python agent (stdlib only): sees what Colima containers can&#x27;t.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#59636e"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.8" flood-color="#0f172a" flood-opacity="0.12"/></filter><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="520" height="432" rx="16" fill="#ffffff"/><rect x="1" y="1" width="518" height="430" rx="16" fill="#ffffff" stroke="#d0d7de"/><path d="M1 17a16 16 0 0 1 16-16h486a16 16 0 0 1 16 16v59H1z" fill="#e2e8f0"/><circle cx="46" cy="39" r="23" fill="#475569"/><g transform="translate(23.0 16.0) scale(1.9166666666666667)" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 18s-6-3.6-6-8a3.3 3.3 0 0 1 6-1.8A3.3 3.3 0 0 1 18 10c0 4.4-6 8-6 8z"/></g><text x="82" y="35" font-size="21" font-weight="700" fill="#1f2328">host-agent</text><text x="82" y="56" font-size="12.5" fill="#59636e">macOS · LaunchDaemon com.homelab.agent</text><rect x="412.0" y="16" width="88.0" height="22" rx="11" fill="#475569"/><text x="456.0" y="31" font-size="11.5" font-weight="600" fill="#fff" text-anchor="middle">macOS host</text><text x="24" y="102" font-size="14" font-style="italic" fill="#1f2328">Native Python agent (stdlib only): sees what Colima containers can&#x27;t.</text><text x="24" y="128" font-size="11" font-weight="700" fill="#475569" letter-spacing="0.6">RESPONSIBILITIES</text><circle cx="30" cy="145.5" r="3" fill="#475569"/><text x="42" y="150" font-size="13.5" fill="#1f2328">Every 30 s: boot time, uptime, load, memory, disk %, Colima and</text><text x="42" y="169" font-size="13.5" fill="#1f2328">cloudflared status</text><circle cx="30" cy="187.5" r="3" fill="#475569"/><text x="42" y="192" font-size="13.5" fill="#1f2328">Reads the macOS “previous shutdown cause” once per boot</text><circle cx="30" cy="210.5" r="3" fill="#475569"/><text x="42" y="215" font-size="13.5" fill="#1f2328">POSTs heartbeats to /api/v1/agent/heartbeat with a per-host</text><text x="42" y="234" font-size="13.5" fill="#1f2328">Bearer token</text><circle cx="30" cy="252.5" r="3" fill="#475569"/><text x="42" y="257" font-size="13.5" fill="#1f2328">Buffers up to 120 heartbeats (~1 h) in spool.jsonl when the API</text><text x="42" y="276" font-size="13.5" fill="#1f2328">is down</text><circle cx="30" cy="294.5" r="3" fill="#475569"/><text x="42" y="299" font-size="13.5" fill="#1f2328">Pings healthchecks.io “mac-mini” every cycle</text><text x="24" y="336" font-size="11" font-weight="700" fill="#475569" letter-spacing="0.6">TALKS TO</text><rect x="24.0" y="348" width="164.60000000000002" height="26" rx="13" fill="#e2e8f0" stroke="#475569" stroke-opacity="0.5"/><text x="36.0" y="365.5" font-size="12.5" fill="#1f2328"><tspan font-weight="700">→ web</tspan><tspan fill="#59636e" dx="6">POST heartbeat</tspan></text><rect x="196.60000000000002" y="348" width="186.79999999999998" height="26" rx="13" fill="#e2e8f0" stroke="#475569" stroke-opacity="0.5"/><text x="208.60000000000002" y="365.5" font-size="12.5" fill="#1f2328"><tspan font-weight="700">→ healthchecks.io</tspan><tspan fill="#59636e" dx="6">ping</tspan></text><line x1="24" x2="496" y1="382" y2="382" stroke="#d0d7de"/><text x="24" y="400" font-size="11.5" fill="#59636e" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace">Dedicated non-admin user · config /usr/local/etc/homelab-agent.json</text></svg>
