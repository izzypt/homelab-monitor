<svg xmlns="http://www.w3.org/2000/svg" width="520" height="348" viewBox="0 0 520 348" role="img" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>redis component</title><desc>redis: Fast, disposable state. Losing it only logs you out.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#59636e"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.8" flood-color="#0f172a" flood-opacity="0.12"/></filter><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="520" height="348" rx="16" fill="#ffffff"/><rect x="1" y="1" width="518" height="346" rx="16" fill="#ffffff" stroke="#d0d7de"/><path d="M1 17a16 16 0 0 1 16-16h486a16 16 0 0 1 16 16v59H1z" fill="#d1fae5"/><circle cx="46" cy="39" r="23" fill="#059669"/><g transform="translate(23.0 16.0) scale(1.9166666666666667)" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5 19 8.5 12 12 5 8.5z"/><path d="M5 12l7 3.5 7-3.5"/><path d="M5 15.5 12 19l7-3.5"/></g><text x="82" y="35" font-size="21" font-weight="700" fill="#1f2328">redis</text><text x="82" y="56" font-size="12.5" fill="#59636e">compose · Redis 7 (alpine)</text><rect x="405.4" y="16" width="94.6" height="22" rx="11" fill="#059669"/><text x="452.7" y="31" font-size="11.5" font-weight="600" fill="#fff" text-anchor="middle">Data stores</text><text x="24" y="102" font-size="14" font-style="italic" fill="#1f2328">Fast, disposable state. Losing it only logs you out.</text><text x="24" y="128" font-size="11" font-weight="700" fill="#059669" letter-spacing="0.6">RESPONSIBILITIES</text><circle cx="30" cy="145.5" r="3" fill="#059669"/><text x="42" y="150" font-size="13.5" fill="#1f2328">Celery broker with two queues: default and checks</text><circle cx="30" cy="168.5" r="3" fill="#059669"/><text x="42" y="173" font-size="13.5" fill="#1f2328">Login sessions with expiry (24 h idle, 7 days absolute)</text><circle cx="30" cy="191.5" r="3" fill="#059669"/><text x="42" y="196" font-size="13.5" fill="#1f2328">Short-lived locks and flags: scheduler lock, network outage</text><text x="42" y="215" font-size="13.5" fill="#1f2328">state</text><text x="24" y="252" font-size="11" font-weight="700" fill="#059669" letter-spacing="0.6">TALKS TO</text><rect x="24.0" y="264" width="245.5" height="26" rx="13" fill="#d1fae5" stroke="#059669" stroke-opacity="0.5"/><text x="36.0" y="281.5" font-size="12.5" fill="#1f2328"><tspan font-weight="700">← api / beat / workers</tspan><tspan fill="#59636e" dx="6">inbound</tspan></text><line x1="24" x2="496" y1="298" y2="298" stroke="#d0d7de"/><text x="24" y="316" font-size="11.5" fill="#59636e" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace">Password-protected · no persistence · internal network · mem 64 MB</text></svg>
