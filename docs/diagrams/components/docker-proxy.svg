<svg xmlns="http://www.w3.org/2000/svg" width="520" height="386" viewBox="0 0 520 386" role="img" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>docker-proxy component</title><desc>docker-proxy: A read-only gate in front of the Docker socket.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#59636e"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.8" flood-color="#0f172a" flood-opacity="0.12"/></filter><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="520" height="386" rx="16" fill="#ffffff"/><rect x="1" y="1" width="518" height="384" rx="16" fill="#ffffff" stroke="#d0d7de"/><path d="M1 17a16 16 0 0 1 16-16h486a16 16 0 0 1 16 16v59H1z" fill="#fef3c7"/><circle cx="46" cy="39" r="23" fill="#d97706"/><g transform="translate(23.0 16.0) scale(1.9166666666666667)" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8.5 12 5l7 3.5v7L12 19l-7-3.5z"/><path d="M5 8.5 12 12l7-3.5M12 12v7"/></g><text x="82" y="35" font-size="21" font-weight="700" fill="#1f2328">docker-proxy</text><text x="82" y="56" font-size="12.5" fill="#59636e">compose · tecnativa/docker-socket-proxy</text><rect x="385.6" y="16" width="114.39999999999999" height="22" rx="11" fill="#d97706"/><text x="442.8" y="31" font-size="11.5" font-weight="600" fill="#fff" text-anchor="middle">Edge / ingress</text><text x="24" y="102" font-size="14" font-style="italic" fill="#1f2328">A read-only gate in front of the Docker socket.</text><text x="24" y="128" font-size="11" font-weight="700" fill="#d97706" letter-spacing="0.6">RESPONSIBILITIES</text><circle cx="30" cy="145.5" r="3" fill="#d97706"/><text x="42" y="150" font-size="13.5" fill="#1f2328">Allows GET /containers/* (plus ping and version); POST is</text><text x="42" y="169" font-size="13.5" fill="#1f2328">disabled</text><circle cx="30" cy="187.5" r="3" fill="#d97706"/><text x="42" y="192" font-size="13.5" fill="#1f2328">The raw socket would be root on the VM; the proxy limits it to</text><text x="42" y="211" font-size="13.5" fill="#1f2328">listing</text><circle cx="30" cy="229.5" r="3" fill="#d97706"/><text x="42" y="234" font-size="13.5" fill="#1f2328">Socket mounted read-only; on an internal network with worker-</text><text x="42" y="253" font-size="13.5" fill="#1f2328">default only</text><text x="24" y="290" font-size="11" font-weight="700" fill="#d97706" letter-spacing="0.6">TALKS TO</text><rect x="24.0" y="302" width="190.9" height="26" rx="13" fill="#fef3c7" stroke="#d97706" stroke-opacity="0.5"/><text x="36.0" y="319.5" font-size="12.5" fill="#1f2328"><tspan font-weight="700">→ docker.sock</tspan><tspan fill="#59636e" dx="6">read-only</tspan></text><line x1="24" x2="496" y1="336" y2="336" stroke="#d0d7de"/><text x="24" y="354" font-size="11.5" fill="#59636e" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace">CONTAINERS=1 · POST=0 · mem 32 MB</text></svg>
