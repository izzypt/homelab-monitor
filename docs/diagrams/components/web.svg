<svg xmlns="http://www.w3.org/2000/svg" width="520" height="443" viewBox="0 0 520 443" role="img" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>web component</title><desc>web: The single entry point and the only published port.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#59636e"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.8" flood-color="#0f172a" flood-opacity="0.12"/></filter><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="520" height="443" rx="16" fill="#ffffff"/><rect x="1" y="1" width="518" height="441" rx="16" fill="#ffffff" stroke="#d0d7de"/><path d="M1 17a16 16 0 0 1 16-16h486a16 16 0 0 1 16 16v59H1z" fill="#fef3c7"/><circle cx="46" cy="39" r="23" fill="#d97706"/><g transform="translate(23.0 16.0) scale(1.9166666666666667)" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.5 18 7v4.6c0 3.6-2.6 6.3-6 7.4-3.4-1.1-6-3.8-6-7.4V7z"/></g><text x="82" y="35" font-size="21" font-weight="700" fill="#1f2328">web</text><text x="82" y="56" font-size="12.5" fill="#59636e">compose · nginx + Angular build</text><rect x="385.6" y="16" width="114.39999999999999" height="22" rx="11" fill="#d97706"/><text x="442.8" y="31" font-size="11.5" font-weight="600" fill="#fff" text-anchor="middle">Edge / ingress</text><text x="24" y="102" font-size="14" font-style="italic" fill="#1f2328">The single entry point and the only published port.</text><text x="24" y="128" font-size="11" font-weight="700" fill="#d97706" letter-spacing="0.6">RESPONSIBILITIES</text><circle cx="30" cy="145.5" r="3" fill="#d97706"/><text x="42" y="150" font-size="13.5" fill="#1f2328">Serves the Angular (Material + ECharts) SPA as static files on /</text><circle cx="30" cy="168.5" r="3" fill="#d97706"/><text x="42" y="173" font-size="13.5" fill="#1f2328">Reverse-proxies /api/* to the api container: same origin, no</text><text x="42" y="192" font-size="13.5" fill="#1f2328">CORS</text><circle cx="30" cy="210.5" r="3" fill="#d97706"/><text x="42" y="215" font-size="13.5" fill="#1f2328">Sets CSP, HSTS, X-Frame-Options, nosniff, Referrer-Policy, body</text><text x="42" y="234" font-size="13.5" fill="#1f2328">limits</text><circle cx="30" cy="252.5" r="3" fill="#d97706"/><text x="42" y="257" font-size="13.5" fill="#1f2328">Receives agent heartbeats on the same port, so the token never</text><text x="42" y="276" font-size="13.5" fill="#1f2328">leaves the Mac</text><text x="24" y="313" font-size="11" font-weight="700" fill="#d97706" letter-spacing="0.6">TALKS TO</text><rect x="24.0" y="325" width="143.9" height="26" rx="13" fill="#fef3c7" stroke="#d97706" stroke-opacity="0.5"/><text x="36.0" y="342.5" font-size="12.5" fill="#1f2328"><tspan font-weight="700">→ api</tspan><tspan fill="#59636e" dx="6">HTTP /api/*</tspan></text><rect x="175.9" y="325" width="177.1" height="26" rx="13" fill="#fef3c7" stroke="#d97706" stroke-opacity="0.5"/><text x="187.9" y="342.5" font-size="12.5" fill="#1f2328"><tspan font-weight="700">← cloudflared</tspan><tspan fill="#59636e" dx="6">inbound</tspan></text><rect x="24.0" y="359" width="169.5" height="26" rx="13" fill="#fef3c7" stroke="#d97706" stroke-opacity="0.5"/><text x="36.0" y="376.5" font-size="12.5" fill="#1f2328"><tspan font-weight="700">← host-agent</tspan><tspan fill="#59636e" dx="6">inbound</tspan></text><line x1="24" x2="496" y1="393" y2="393" stroke="#d0d7de"/><text x="24" y="411" font-size="11.5" fill="#59636e" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace">127.0.0.1:${WEB_PORT} (default 8380) · image homelab-monitor-web</text></svg>
