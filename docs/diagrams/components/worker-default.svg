<svg xmlns="http://www.w3.org/2000/svg" width="520" height="424" viewBox="0 0 520 424" role="img" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>worker-default component</title><desc>worker-default: Everything that isn&#x27;t a check, isolated from the checks queue.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#59636e"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.8" flood-color="#0f172a" flood-opacity="0.12"/></filter><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="520" height="424" rx="16" fill="#ffffff"/><rect x="1" y="1" width="518" height="422" rx="16" fill="#ffffff" stroke="#d0d7de"/><path d="M1 17a16 16 0 0 1 16-16h486a16 16 0 0 1 16 16v59H1z" fill="#ede9fe"/><circle cx="46" cy="39" r="23" fill="#7c3aed"/><g transform="translate(23.0 16.0) scale(1.9166666666666667)" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2.6"/><path d="M12 4.5v2.2M12 17.3v2.2M4.5 12h2.2M17.3 12h2.2M6.7 6.7l1.6 1.6M15.7 15.7l1.6 1.6M6.7 17.3l1.6-1.6M15.7 8.3l1.6-1.6"/></g><text x="82" y="35" font-size="21" font-weight="700" fill="#1f2328">worker-default</text><text x="82" y="56" font-size="12.5" fill="#59636e">compose · Celery worker, queue “default”</text><rect x="398.8" y="16" width="101.19999999999999" height="22" rx="11" fill="#7c3aed"/><text x="449.4" y="31" font-size="11.5" font-weight="600" fill="#fff" text-anchor="middle">Celery tasks</text><text x="24" y="102" font-size="14" font-style="italic" fill="#1f2328">Everything that isn&#x27;t a check, isolated from the checks queue.</text><text x="24" y="128" font-size="11" font-weight="700" fill="#7c3aed" letter-spacing="0.6">RESPONSIBILITIES</text><circle cx="30" cy="145.5" r="3" fill="#7c3aed"/><text x="42" y="150" font-size="13.5" fill="#1f2328">schedule_due_checks, evaluate_hosts (STALE after 90 s),</text><text x="42" y="169" font-size="13.5" fill="#1f2328">check_network</text><circle cx="30" cy="187.5" r="3" fill="#7c3aed"/><text x="42" y="192" font-size="13.5" fill="#1f2328">snapshot_containers through docker-proxy (the only service that</text><text x="42" y="211" font-size="13.5" fill="#1f2328">can reach it)</text><circle cx="30" cy="229.5" r="3" fill="#7c3aed"/><text x="42" y="234" font-size="13.5" fill="#1f2328">send_alert: SMTP email, acks_late, backoff for ~1 h, idempotent</text><circle cx="30" cy="252.5" r="3" fill="#7c3aed"/><text x="42" y="257" font-size="13.5" fill="#1f2328">rollup_and_prune, check_tls_expiry, ping_healthcheck</text><text x="24" y="294" font-size="11" font-weight="700" fill="#7c3aed" letter-spacing="0.6">TALKS TO</text><rect x="24.0" y="306" width="200.5" height="26" rx="13" fill="#ede9fe" stroke="#7c3aed" stroke-opacity="0.5"/><text x="36.0" y="323.5" font-size="12.5" fill="#1f2328"><tspan font-weight="700">→ redis</tspan><tspan fill="#59636e" dx="6">consume / enqueue</tspan></text><rect x="232.5" y="306" width="126.7" height="26" rx="13" fill="#ede9fe" stroke="#7c3aed" stroke-opacity="0.5"/><text x="244.5" y="323.5" font-size="12.5" fill="#1f2328"><tspan font-weight="700">→ postgres</tspan><tspan fill="#59636e" dx="6">SQL</tspan></text><rect x="24.0" y="340" width="157.1" height="26" rx="13" fill="#ede9fe" stroke="#7c3aed" stroke-opacity="0.5"/><text x="36.0" y="357.5" font-size="12.5" fill="#1f2328"><tspan font-weight="700">→ docker-proxy</tspan><tspan fill="#59636e" dx="6">GET</tspan></text><rect x="189.1" y="340" width="110.1" height="26" rx="13" fill="#ede9fe" stroke="#7c3aed" stroke-opacity="0.5"/><text x="201.1" y="357.5" font-size="12.5" fill="#1f2328"><tspan font-weight="700">→ SMTP</tspan><tspan fill="#59636e" dx="6">email</tspan></text><line x1="24" x2="496" y1="374" y2="374" stroke="#d0d7de"/><text x="24" y="392" font-size="11.5" fill="#59636e" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace">Prefork pool × 2 · networks data + egress + docker · mem 256 MB</text></svg>
