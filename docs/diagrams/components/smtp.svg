<svg xmlns="http://www.w3.org/2000/svg" width="520" height="367" viewBox="0 0 520 367" role="img" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>SMTP relay component</title><desc>SMTP relay: Delivers the alert emails sent by worker-default.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#59636e"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.8" flood-color="#0f172a" flood-opacity="0.12"/></filter><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="520" height="367" rx="16" fill="#ffffff"/><rect x="1" y="1" width="518" height="365" rx="16" fill="#ffffff" stroke="#d0d7de"/><path d="M1 17a16 16 0 0 1 16-16h486a16 16 0 0 1 16 16v59H1z" fill="#fce7f3"/><circle cx="46" cy="39" r="23" fill="#db2777"/><g transform="translate(23.0 16.0) scale(1.9166666666666667)" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="7" width="14" height="10" rx="1.5"/><path d="M5.5 7.8 12 13l6.5-5.2"/></g><text x="82" y="35" font-size="21" font-weight="700" fill="#1f2328">SMTP relay</text><text x="82" y="56" font-size="12.5" fill="#59636e">Any provider · outside the Mac</text><rect x="379.0" y="16" width="121.0" height="22" rx="11" fill="#db2777"/><text x="439.5" y="31" font-size="11.5" font-weight="600" fill="#fff" text-anchor="middle">Outside the Mac</text><text x="24" y="102" font-size="14" font-style="italic" fill="#1f2328">Delivers the alert emails sent by worker-default.</text><text x="24" y="128" font-size="11" font-weight="700" fill="#db2777" letter-spacing="0.6">RESPONSIBILITIES</text><circle cx="30" cy="145.5" r="3" fill="#db2777"/><text x="42" y="150" font-size="13.5" fill="#1f2328">Monitor down / recovered, host stale / recovered, unexpected</text><text x="42" y="169" font-size="13.5" fill="#1f2328">reboot</text><circle cx="30" cy="187.5" r="3" fill="#db2777"/><text x="42" y="192" font-size="13.5" fill="#1f2328">TLS certificate expiring within 14 days, disk above 90%, local</text><text x="42" y="211" font-size="13.5" fill="#1f2328">network outage</text><circle cx="30" cy="229.5" r="3" fill="#db2777"/><text x="42" y="234" font-size="13.5" fill="#1f2328">Never for container changes (those are only recorded)</text><text x="24" y="271" font-size="11" font-weight="700" fill="#db2777" letter-spacing="0.6">TALKS TO</text><rect x="24.0" y="283" width="140.5" height="26" rx="13" fill="#fce7f3" stroke="#db2777" stroke-opacity="0.5"/><text x="36.0" y="300.5" font-size="12.5" fill="#1f2328"><tspan font-weight="700">→ operator</tspan><tspan fill="#59636e" dx="6">email</tspan></text><line x1="24" x2="496" y1="317" y2="317" stroke="#d0d7de"/><text x="24" y="335" font-size="11.5" fill="#59636e" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace">Host, credentials and recipients live in .env only</text></svg>
