version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      # Angular's build tool pins TypeScript to one minor (@angular/build 22.3 needs >=6.0 <6.1).
      # Take TypeScript majors with an Angular upgrade (ng update), not on their own.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*", "typescript", "zone.js"]
      frontend:
        patterns: ["*"]
        exclude-patterns: ["@angular/*", "@angular-devkit/*", "typescript"]

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
