# homelab-monitor stack. See README sections 4 and 11.
# Only `web` (nginx) publishes a port, on 127.0.0.1:${WEB_PORT:-8380}.
# For local development use: docker compose -f docker-compose.yml -f compose.dev.yml up

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Hardening shared by every service that runs our own image.
x-app: &app
  image: ghcr.io/izzypt/homelab-monitor-api:${IMAGE_TAG:-dev}
  build: ./backend
  env_file: .env
  restart: unless-stopped
  logging: *logging
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  networks: [data, egress]

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-homelab_monitor}
      POSTGRES_USER: ${POSTGRES_USER:-homelab_monitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    networks: [data]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    # The password is expanded from the environment inside the container, so it is not written
    # into the compose config or `docker inspect` output. No persistence: Redis only holds
    # broker messages, sessions and short-lived locks.
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --save '' --appendonly no"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}  # required, from .env
    mem_limit: 64m
    networks: [data]

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    # Reachable by nginx on `frontend`; no published port.
    networks: [data, egress, frontend]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(urllib.request.urlopen('http://127.0.0.1:8000/api/readyz', timeout=3).status != 200)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 192m

  worker-checks:
    <<: *app
    command: ["celery", "-A", "app.celery_app", "worker", "-Q", "checks", "-P", "threads", "-c", "16", "-n", "checks@%h", "--loglevel", "INFO"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    mem_limit: 192m

  worker-default:
    <<: *app
    # The only service that can reach the Docker socket proxy (container snapshots).
    networks: [data, egress, docker]
    command: ["celery", "-A", "app.celery_app", "worker", "-Q", "default", "-P", "prefork", "-c", "2", "-n", "default@%h", "--loglevel", "INFO"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    mem_limit: 256m

  web:
    image: ghcr.io/izzypt/homelab-monitor-web:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    logging: *logging
    # The single entry point: Cloudflare Tunnel and the host agent use 127.0.0.1 only.
    ports:
      - "127.0.0.1:${WEB_PORT:-8380}:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 64m
    networks: [frontend]

  docker-proxy:
    # Read-only gate in front of the Docker socket (README section 10): only GET /containers/*
    # (plus ping/version/events, read-only) is allowed. No POST, exec, images or volumes.
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    logging: *logging
    environment:
      CONTAINERS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    security_opt:
      - no-new-privileges:true
    mem_limit: 32m
    networks: [docker]

  beat:
    <<: *app
    # Exactly one beat replica. Schedule state lives in tmpfs; the schedule itself is in code.
    command: ["celery", "-A", "app.celery_app", "beat", "-s", "/tmp/celerybeat-schedule", "--loglevel", "INFO"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    mem_limit: 128m

networks:
  # Postgres and Redis: no route to the outside world.
  data:
    internal: true
  # Outbound access for checks, SMTP and healthchecks.io pings.
  egress: {}
  # worker-default <-> docker-proxy only.
  docker:
    internal: true
  # web (nginx) <-> api. Not internal, because web publishes a port on it.
  frontend: {}

volumes:
  pgdata: {}
