[project]
name = "homelab-monitor"
version = "0.1.0"
description = "Homelab monitor: API, Celery workers and beat"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "email-validator>=2.2",
    "celery[redis]>=5.4",
    "fastapi>=0.115",
    "httpx>=0.28",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pip-audit>=2.7",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection uses calls in argument defaults by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["E501"]
"tests/*" = ["S105", "S106"]  # test passwords are fixtures, not secrets

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
