# nginx for homelab-monitor (README sections 4 and 10): serves the Angular build and proxies /api.
# The only published port; Cloudflare Tunnel and the host agent reach it on 127.0.0.1:${WEB_PORT}.

upstream api {
    server api:8000;
    keepalive 8;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # The largest legitimate body is an agent heartbeat batch (well under 256 KB).
    client_max_body_size 256k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    # API docs are useful in development (compose.dev.yml exposes the API directly),
    # but there is no reason to publish the schema of a home network on the internet.
    location ~ ^/api/(docs|openapi\.json|redoc) {
        return 404;
    }

    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # CF-Connecting-IP (set by Cloudflare) is passed through unchanged for login rate limiting.
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_buffering on;
    }

    # Hashed build output: cache for a year.
    location ~* \.(?:js|css|woff2?|ico|svg)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # SPA routes fall back to index.html, which is never cached so deploys show up at once.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
