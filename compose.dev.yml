# Local development overrides: hot reload and the API on 127.0.0.1:8000.
# Usage: make dev
services:
  api:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    read_only: false
    volumes:
      - ./backend/app:/app/app
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ENVIRONMENT: development
      SESSION_COOKIE_SECURE: "false"  # plain http on localhost
